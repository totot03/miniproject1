spring:
  application:
    name: miniProject1-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pharmaprice}
    username: ${POSTGRES_USER:pharmaprice}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate       # update/create 절대 금지
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# TraceIdFilter가 MDC에 넣은 traceId를 콘솔 로그에도 찍는다 — 에러 응답의 traceId로
# 로그를 바로 찾을 수 있어야 한다(docs/ROADMAP.md T-35 3번). logback-spring.xml을 새로
# 만들지 않고도 Spring Boot가 지원하는 프로퍼티만으로 기본 콘솔 패턴에 끼워 넣는다.
logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14

recommendation:
  weights:
    price: 0.60
    distance: 0.25
    freshness: 0.15
  freshness-half-life-days: 30
  price-window-days: 90
  price-window-fallback-days: 180
  outlier:
    iqr-multiplier: 1.5
    min-samples: 4
